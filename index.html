    <script>
      // Guard against browser extension injection collisions (e.g. wallet extensions colliding on window.ethereum)
      (function() {
        try {
          var originalDefineProperty = Object.defineProperty;
          Object.defineProperty = function(target, property, descriptor) {
            if (target === window && property === 'ethereum') {
              try {
                return originalDefineProperty.call(this, target, property, Object.assign({}, descriptor, {
                  configurable: true
                }));
              } catch (_) {
                try {
                  if (descriptor && 'value' in descriptor) {
                    target.ethereum = descriptor.value;
                  }
                } catch (__) {}
                return target;
              }
            }
            return originalDefineProperty.call(this, target, property, descriptor);
          };
        } catch (_) {}

        // Suppress unhandled errors dispatched by third-party browser extensions
        window.addEventListener('error', function(e) {
          if (
            (e.filename && (e.filename.indexOf('chrome-extension://') !== -1 || e.filename.indexOf('moz-extension://') !== -1)) ||
            (e.message && e.message.indexOf('ethereum') !== -1)
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reasonStr = (e.reason && (e.reason.stack || e.reason.message)) || '';
          if (
            reasonStr.indexOf('chrome-extension://') !== -1 ||
            reasonStr.indexOf('moz-extension://') !== -1 ||
            reasonStr.indexOf('ethereum') !== -1
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
